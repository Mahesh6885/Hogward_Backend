<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>403 — Forbidden | Hogwarts Legacy 5.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
<div class="stars-layer" aria-hidden="true"></div>
<div class="error-page">
  <div style="max-width:480px;width:100%">
    <div style="font-size:5rem;margin-bottom:1rem;animation:castleFloat 4s ease-in-out infinite">🐍</div>

    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
      <a href="dashboard.html" class="btn btn-primary btn-lg">🏠 My Dashboard</a>
      <button onclick="history.back()" class="btn btn-ghost btn-lg">← Go Back</button>
    </div>
  </div>
