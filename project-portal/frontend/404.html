<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Hogwarts Legacy 5.0</title>
  <meta name="description" content="The page you are looking for does not exist." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="stars-layer" aria-hidden="true"></div>
<div class="error-page">
  <div style="max-width:480px;width:100%">
    <div style="font-size:5rem;margin-bottom:1rem;animation:castleFloat 4s ease-in-out infinite">🗺️</div>
    <div class="error-code">404</div>
    <h1 class="error-title">The Map Shows Nothing Here</h1>
    <p class="error-msg">The page you seek has vanished from the Marauder's Map. Perhaps you took a wrong turn at the third-floor corridor.</p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
      <a href="index.html" class="btn btn-primary btn-lg">⚡ Return to Portal</a>
      <button onclick="history.back()" class="btn btn-ghost btn-lg">← Go Back</button>
    </div>
  </div>
</div>
</body>
</html>
