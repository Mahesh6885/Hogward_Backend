<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 — Server Error | Hogwarts Legacy 5.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="stars-layer" aria-hidden="true"></div>
<div class="error-page">
  <div style="max-width:480px;width:100%">
    <div style="font-size:5rem;margin-bottom:1rem;animation:castleFloat 4s ease-in-out infinite">💥</div>
    <div class="error-code">500</div>
    <h1 class="error-title">A Dark Magic Mishap</h1>
    <p class="error-msg">Something went wrong in the dungeons of the server. Our team of wizards is already working on a remedy.</p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
      <button onclick="window.location.reload()" class="btn btn-primary btn-lg">🔄 Try Again</button>
      <a href="index.html" class="btn btn-ghost btn-lg">⚡ Return to Portal</a>
    </div>
  </div>
</div>
</body>
</html>
