<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Portal — Login</title>
  <meta name="description" content="Sign in to the Project Portal — a private project topic selection and review system." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-bg"></div>
    <div class="login-card fade-in">
      <div class="login-logo">🎓</div>
      <h1 class="login-title">Project Portal</h1>
      <p class="login-subtitle">Sign in with your credentials to continue</p>

      <div id="alert" class="alert alert-error alert-hidden" role="alert">
        <span>⚠️</span>
        <span id="alert-msg"></span>
      </div>

      <form class="login-form" id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username or Email</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username or email"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <button class="btn btn-primary btn-lg btn-full" type="submit" id="login-btn">
          Sign In
        </button>
      </form>

      <p class="text-center mt-3 text-xs text-muted">
        No public registration · Contact your administrator for access
      </p>
    </div>
  </div>

  <script type="module">
    import { login } from './js/auth.js';
    import { getToken, getUser } from './js/api.js';

    // Redirect if already logged in
    const token = getToken();
    const existing = getUser();
    if (token && existing) {
      window.location.href = existing.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
    }

    const form = document.getElementById('login-form');
    const btn  = document.getElementById('login-btn');
    const alert = document.getElementById('alert');
    const alertMsg = document.getElementById('alert-msg');

    function showError(msg) {
      alertMsg.textContent = msg;
      alert.classList.remove('alert-hidden');
    }
    function hideError() {
      alert.classList.add('alert-hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { showError('Please enter username and password.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in…';

      try {
        const user = await login(username, password);
        if (user.role === 'ADMIN') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        showError(err.message || 'Login failed. Check your credentials.');
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>
</html>
